# Example GitHub / CI Beacon profile.
# Authentication is optional for public repos but recommended for private repos
# and higher rate limits. Set GITHUB_TOKEN in the environment; do not put tokens
# in this file.

palette = "wooting"
brightness = 96
fps = 15
seconds = 0
continuous = true
warn_on_close_error = true

[signal]
kind = "github-ci"
repo = "owner/repo"
# branch = "main"
# pull_request = 123
token_env = "GITHUB_TOKEN"
poll_seconds = 60
stale_seconds = 300
